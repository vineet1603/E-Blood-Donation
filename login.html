<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Blood | Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { 
            font-family: 'Inter', system-ui, -apple-system, sans-serif; 
            background-color: #fdfbfb; 
        }
        
        /* 💎 Glassmorphism Core CSS */
        .glass-card {
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 8px 32px 0 rgba(220, 38, 38, 0.15); /* Soft red shadow */
        }

        .glass-input {
            background: rgba(255, 255, 255, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.8);
        }

        /* 🎨 Animated Background Blobs */
        @keyframes blob {
            0% { transform: translate(0px, 0px) scale(1); }
            33% { transform: translate(30px, -50px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
            100% { transform: translate(0px, 0px) scale(1); }
        }
        .animate-blob { animation: blob 7s infinite alternate ease-in-out; }
        .animation-delay-2000 { animation-delay: 2s; }
        .animation-delay-4000 { animation-delay: 4s; }
    </style>
</head>
<body class="antialiased flex items-center justify-center min-h-screen relative overflow-hidden text-gray-900">

    <div class="absolute top-1/4 left-1/4 w-96 h-96 bg-red-300 rounded-full mix-blend-multiply filter blur-[80px] opacity-70 animate-blob z-0"></div>
    <div class="absolute top-1/3 right-1/4 w-96 h-96 bg-rose-200 rounded-full mix-blend-multiply filter blur-[80px] opacity-70 animate-blob animation-delay-2000 z-0"></div>
    <div class="absolute bottom-1/4 left-1/3 w-80 h-80 bg-pink-300 rounded-full mix-blend-multiply filter blur-[80px] opacity-60 animate-blob animation-delay-4000 z-0"></div>

    <div class="glass-card p-10 rounded-3xl w-full max-w-md relative z-10">
        
        <div class="flex justify-center items-center gap-2 mb-8 drop-shadow-sm">
            <svg class="w-8 h-8 text-red-600" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2.69l5.66 5.66a8 8 0 11-11.31 0z" /></svg>
            <h1 class="text-3xl font-bold tracking-tight text-gray-900">E-Blood.</h1>
        </div>

        <div class="flex gap-6 mb-8 border-b border-gray-900/10 pb-1 justify-center">
            <button id="tab-login" onclick="switchMode('login')" class="text-lg font-bold text-red-600 border-b-2 border-red-600 pb-2 transition-all drop-shadow-sm">Sign In</button>
            <button id="tab-signup" onclick="switchMode('signup')" class="text-lg font-medium text-gray-500 hover:text-gray-900 pb-2 transition-all">Create Account</button>
        </div>

        <div class="space-y-5">
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1 drop-shadow-sm">Email Address</label>
                <input id="email" type="email" placeholder="you@example.com" class="glass-input w-full p-3.5 rounded-xl focus:bg-white focus:ring-2 focus:ring-red-500 outline-none transition-all placeholder-gray-400">
            </div>
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1 drop-shadow-sm">Password</label>
                <input id="password" type="password" placeholder="••••••••" class="glass-input w-full p-3.5 rounded-xl focus:bg-white focus:ring-2 focus:ring-red-500 outline-none transition-all placeholder-gray-400">
            </div>

            <button id="actionBtn" onclick="handleAuth()" class="w-full bg-red-600/90 backdrop-blur-sm text-white font-semibold py-4 rounded-xl mt-4 hover:bg-red-700 active:scale-[0.98] transition-all shadow-lg shadow-red-600/30">
                Sign In securely
            </button>
        </div>

    </div>

    <script>
        let currentMode = 'login';

        function switchMode(mode) {
            currentMode = mode;
            document.getElementById('tab-login').className = mode === 'login' ? "text-lg font-bold text-red-600 border-b-2 border-red-600 pb-2 transition-all drop-shadow-sm" : "text-lg font-medium text-gray-500 hover:text-gray-900 pb-2 transition-all";
            document.getElementById('tab-signup').className = mode === 'signup' ? "text-lg font-bold text-red-600 border-b-2 border-red-600 pb-2 transition-all drop-shadow-sm" : "text-lg font-medium text-gray-500 hover:text-gray-900 pb-2 transition-all";
            document.getElementById('actionBtn').innerText = mode === 'login' ? "Sign In securely" : "Create Account";
            document.getElementById('actionBtn').className = mode === 'login' 
                ? "w-full bg-red-600/90 backdrop-blur-sm text-white font-semibold py-4 rounded-xl mt-4 hover:bg-red-700 active:scale-[0.98] transition-all shadow-lg shadow-red-600/30"
                : "w-full bg-gray-900/90 backdrop-blur-sm text-white font-semibold py-4 rounded-xl mt-4 hover:bg-black active:scale-[0.98] transition-all shadow-lg shadow-gray-900/30";
        }

        async function handleAuth() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            if (!email || !password) {
                alert("Please enter both email and password.");
                return;
            }

            const endpoint = currentMode === 'login' ? '/api/auth/login' : '/api/auth/signup';

            try {
                const response = await fetch(`${endpoint}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                
                const data = await response.json();

                if (response.ok) {
                    if (currentMode === 'signup') {
                        alert("✅ Account created! Please sign in.");
                        switchMode('login');
                        document.getElementById('password').value = '';
                    } else {
                        localStorage.setItem('userToken', data.token);
                        localStorage.setItem('userEmail', data.email);
                        window.location.href = 'index.html';
                    }
                } else {
                    alert("❌ " + data.error);
                }
            } catch (err) {
                alert("Backend offline. Ensure server.js is running.");
            }
        }
    </script>
</body>
</html>
